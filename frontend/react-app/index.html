<!doctype html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Rougyy — Ask your database</title>
    <meta
      name="description"
      content="Rougyy is a natural-language-to-SQL agent. Ask a question about your database and get a grounded, SQL-backed answer."
    />
    <style>
      html {
        background: #f5f6f8;
      }
      html.dark {
        background: #08080d;
      }
    </style>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        var theme = localStorage.getItem("rougyy.theme");
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
      } catch (e) {
        // ignore
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
