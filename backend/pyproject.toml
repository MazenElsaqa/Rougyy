[project]
name = "rougyy-backend"
version = "0.1.0"
description = "FastAPI serving layer for the Rougyy agent pipeline (Milestone 6)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    # --- mirrors requirements.txt at the repo root: the pipeline this
    # service imports (via sys.path, see main.py) needs these too,
    # since this service builds its own isolated environment from
    # this file rather than the root project's. ---
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "sqlglot>=25.0",
    "openai>=1.30,<2",
    "httpx>=0.27",
]
